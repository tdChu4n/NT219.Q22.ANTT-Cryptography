# vm1-tls-proxy.conf — VM1 TLS terminator cho License Server
# nginx listen 3443 (TLS 1.3) → proxy nội bộ sang license-server :3000
# Deploy:
#   sudo cp vm1-tls-proxy.conf /etc/nginx/sites-available/nt219-license-tls.conf
#   sudo ln -sf /etc/nginx/sites-available/nt219-license-tls.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 3443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/tls/vm1.crt;
    ssl_certificate_key /etc/nginx/tls/vm1.key;

    # Chỉ TLS 1.2 + 1.3, AEAD cipher + ECDHE (forward secrecy)
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    # Proxy toàn bộ → license server nội bộ (localhost:3000)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
