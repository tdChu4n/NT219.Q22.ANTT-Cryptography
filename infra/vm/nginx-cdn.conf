# NT219 CDN edge for VM deployment.
# Install to /etc/nginx/sites-available/nt219-cdn.conf and enable it from
# /etc/nginx/sites-enabled/. This file is included inside nginx's http {} block
# on Ubuntu/Debian packages.

include /etc/nginx/snippets/nt219-cert-pin.conf;

upstream nt219_license {
    server VM_APP_PRIVATE_IP:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name cdn.example.local;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cdn.example.local;

    ssl_certificate     /etc/nt219/certs/fullchain.pem;
    ssl_certificate_key /etc/nt219/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    root /srv/nt219/media;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/dash+xml application/vnd.apple.mpegurl application/json application/javascript text/css text/plain text/xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok-tls\n";
    }

    location /license {
        proxy_pass http://nt219_license;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_no_cache 1;
        proxy_cache_bypass 1;

        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;
        add_header X-CDN-Cert-Pin "$cdn_cert_pin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location /api/ {
        proxy_pass http://nt219_license;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;
        add_header X-CDN-Cert-Pin "$cdn_cert_pin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location /video/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, Date, Server, X-CDN-Cert-Pin" always;
        add_header Accept-Ranges "bytes" always;
        add_header X-CDN-Cert-Pin "$cdn_cert_pin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        max_ranges 100;

        gzip off;
        gzip_static off;

        if ($request_method = OPTIONS) {
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    location ~* ^/video/.*\.(m4s|mp4|m4v|ts)$ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, X-CDN-Cert-Pin" always;
        add_header Accept-Ranges "bytes" always;
        add_header X-CDN-Cert-Pin "$cdn_cert_pin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        max_ranges 100;
        gzip off;
        gzip_static off;

        if ($request_method = OPTIONS) {
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    location ~* ^/video/.*\.(mpd|m3u8)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-CDN-Cert-Pin "$cdn_cert_pin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
