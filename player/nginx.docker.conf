server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — mọi route không tìm thấy file → trả index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* và /license → license-server (giống vite dev proxy)
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $license_upstream "license-server:3000";
        proxy_pass         http://$license_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Strip Origin để license-server không bị CORS reject khi traffic đến qua
        # reverse proxy bên ngoài (Cloudflare Tunnel, load-balancer...). Nginx là
        # gateway tin cậy nên không cần CORS check ở lớp này.
        proxy_set_header   Origin            "";
        proxy_read_timeout 30s;
    }

    location /license {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $license_upstream "license-server:3000";
        proxy_pass         http://$license_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Origin            "";
        proxy_no_cache     1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    # Proxy /video/* → cdn-sim (video segments + manifest)
    location /video/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $cdn_upstream "cdn-sim:80";
        proxy_pass         http://$cdn_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Range             $http_range;
        proxy_set_header   If-Range          $http_if_range;
        proxy_read_timeout 60s;
        add_header Access-Control-Allow-Origin * always;
    }

    # Health check
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
