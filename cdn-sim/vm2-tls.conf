# nt219-cdn.conf — VM2 CDN Edge: HTTP (80) + HTTPS TLS 1.3 (443)
# Deploy: sudo cp /tmp/nt219/cdn-sim/vm2-tls.conf /etc/nginx/sites-available/nt219-cdn.conf
#         sudo nginx -t && sudo systemctl reload nginx

# ---- HTTP (port 80) — giữ để fallback ----
server {
    listen 80;
    server_name _;
    root /srv/nt219/media;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location /video/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Accept-Ranges "bytes" always;
        gzip off;
        if ($request_method = OPTIONS) { add_header Content-Length 0; return 204; }
    }
}

# ---- HTTPS (port 443) — TLS 1.3 gateway ----
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /srv/nt219/media;

    ssl_certificate     /etc/nginx/tls/vm2.crt;
    ssl_certificate_key /etc/nginx/tls/vm2.key;

    # Chỉ TLS 1.2 + 1.3, AEAD cipher + ECDHE (forward secrecy)
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    # HSTS — ép HTTPS 1 năm
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok-tls\n";
    }

    # Video segments (local file)
    location /video/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Accept-Ranges "bytes" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        gzip off;
        if ($request_method = OPTIONS) { add_header Content-Length 0; return 204; }
    }

    # Proxy /license → VM1 License Server (giao tiếp 2 VM)
    location /license {
        proxy_pass http://192.168.155.10:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin            "";
        add_header Cache-Control "no-store" always;
    }

    # Proxy /api → VM1 License Server (auth, health)
    location /api/ {
        proxy_pass http://192.168.155.10:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin            "";
    }
}
